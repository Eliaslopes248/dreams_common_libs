[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dreams-common"
version = "1.0.0"
description = "Shared Python utilities for Dreams applications"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "boto3",
    "supabase",
]

[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3.1,<4"]
mysql = ["mysql-connector-python>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
